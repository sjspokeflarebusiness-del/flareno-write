<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" /> <!-- Hides from Google -->
  <title>Admin - Add Article</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="background: var(--bg); color: white; padding: 40px;">
  <div style="max-width: 600px; margin: 0 auto;">
    <h1 style="color: var(--orange);">Secret Admin Panel</h1>
    <p style="color: var(--muted); margin-bottom: 30px;">Fill this out to generate the code for your Works page.</p>

    <div class="admin-form" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px;">
      <label style="display:block; margin-bottom: 10px;">Category (e.g. 06 · BUSINESS)</label>
      <input type="text" id="cat" placeholder="06 · BUSINESS" style="width:100%; padding: 12px; margin-bottom: 15px; background: #000; color: #fff; border: 1px solid #333; border-radius: 8px;" />

      <label style="display:block; margin-bottom: 10px;">Article Title</label>
      <input type="text" id="title" placeholder="How to Start a Blog" style="width:100%; padding: 12px; margin-bottom: 15px; background: #000; color: #fff; border: 1px solid #333; border-radius: 8px;" />

      <label style="display:block; margin-bottom: 10px;">Short Description</label>
      <input type="text" id="desc" placeholder="A quick guide for beginners." style="width:100%; padding: 12px; margin-bottom: 15px; background: #000; color: #fff; border: 1px solid #333; border-radius: 8px;" />

      <label style="display:block; margin-bottom: 10px;">Google Doc Link</label>
      <input type="url" id="link" placeholder="https://docs.google.com/..." style="width:100%; padding: 12px; margin-bottom: 20px; background: #000; color: #fff; border: 1px solid #333; border-radius: 8px;" />

      <button onclick="generateCode()" class="button button-primary" style="width: 100%;">Generate HTML Code</button>
    </div>

    <textarea id="output" style="width: 100%; height: 150px; margin-top: 20px; background: #111; color: #00ff00; padding: 15px; border-radius: 8px; display:none;" readonly></textarea>
    <p id="copyMsg" style="color: #8ee9ba; display:none; margin-top: 10px;">Copied to clipboard! Now paste this into works.html.</p>
  </div>

  <script>
    function generateCode() {
      const cat = document.getElementById("cat").value || "NEW";
      const title = document.getElementById("title").value;
      const desc = document.getElementById("desc").value;
      const link = document.getElementById("link").value;

      if(!title || !link) { alert("Please enter at least a title and link."); return; }

      const htmlCode = `
        <!-- ARTICLE -->
        <a class="sample-card" href="${link}" target="_blank">
          <span>${cat}</span>
          <h3>${title}</h3>
          <p>${desc}</p>
        </a>
      `;

      const output = document.getElementById("output");
      output.style.display = "block";
      output.value = htmlCode;
      
      // Auto copy
      output.select();
      document.execCommand("copy");
      document.getElementById("copyMsg").style.display = "block";
    }
  </script>
</body>
</html>
